<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Outer subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="#3B82F6" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Main Shield / Document Emblem -->
  <g filter="url(#shadow)" transform="translate(32, 28)">
    <!-- Document Shield Base -->
    <path d="M224 40 L350 90 C350 240 260 350 224 380 C188 350 98 240 98 90 Z" 
          fill="#1E293B" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Balance Scales of Justice & Rupee Symbol Integration -->
    <!-- Pillar -->
    <line x1="224" y1="120" x2="224" y2="300" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <!-- Beam -->
    <line x1="140" y1="150" x2="308" y2="150" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Left Scale Pan -->
    <line x1="140" y1="150" x2="120" y2="200" stroke="#94A3B8" stroke-width="4"/>
    <line x1="140" y1="150" x2="160" y2="200" stroke="#94A3B8" stroke-width="4"/>
    <path d="M110 200 Q140 225 170 200 Z" fill="url(#gold)"/>

    <!-- Right Scale Pan -->
    <line x1="308" y1="150" x2="288" y2="200" stroke="#94A3B8" stroke-width="4"/>
    <line x1="308" y1="150" x2="328" y2="200" stroke="#94A3B8" stroke-width="4"/>
    <path d="M278 200 Q308 225 338 200 Z" fill="url(#gold)"/>

    <!-- Center Top Badge -->
    <circle cx="224" cy="120" r="14" fill="url(#gold)"/>

    <!-- Indian Rupee Badge on Pedestal -->
    <circle cx="224" cy="270" r="28" fill="#1E3A8A" stroke="url(#gold)" stroke-width="4"/>
    <text x="224" y="280" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FDE047" text-anchor="middle">₹</text>

    <!-- 45-Days Lightning Tag -->
    <g transform="translate(164, 340)">
      <rect x="0" y="0" width="120" height="34" rx="17" fill="#2563EB" stroke="#60A5FA" stroke-width="2"/>
      <text x="60" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">45 DAYS</text>
    </g>
  </g>
</svg>
